<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>robocad – Learn, Create, Innovate</title><style>
:root{--bg:#eef4ff;--ink:#0b1a4a;--mu:#4a5a85;--blue:#0b45e8;--cyan:#27c4ff;--pc:rgba(255,255,255,.88);--ln:rgba(80,130,255,.32);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--ink:#eaf1ff;--mu:#a9b9e6;--blue:#6b92ff;--pc:rgba(22,35,80,.9);--ln:rgba(110,150,255,.35)}}
:root[data-theme="dark"]{--bg:#0a1330;--ink:#eaf1ff;--mu:#a9b9e6;--blue:#6b92ff;--pc:rgba(22,35,80,.9);--ln:rgba(110,150,255,.35)}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(900px 500px at 10% 0,#dbe9ff,transparent),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px}
.top{display:flex;align-items:center;gap:20px;padding:16px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:4px;font-weight:700;font-size:2rem;letter-spacing:-.04em;color:var(--ink);text-decoration:none}
.logo b{color:var(--blue)}
.tag{display:flex;gap:10px;padding-left:18px;border-left:1px solid var(--ln);font-weight:500}.tag i{font-style:normal;color:var(--mu)}
.search{flex:1;min-width:220px;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--pc);border:1.5px solid var(--ln);border-radius:40px;padding:10px 18px}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--ink);width:100%}.search:focus-within{border-color:var(--blue)}
.avatar{width:46px;height:46px;border-radius:50%;background:#0b45e8;display:grid;place-items:center}
#home,#list,#detail{display:none}body[data-v=home] #home,body[data-v=list] #list,body[data-v=detail] #detail{display:block}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chips a{padding:8px 16px;border-radius:30px;border:1.5px solid var(--ln);background:var(--pc);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem}
.chips a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rows{list-style:none;padding:0;display:flex;flex-direction:column;gap:16px;max-width:900px}
.row{display:flex;gap:16px;align-items:center}
.num{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
.rcard{flex:1;display:flex;gap:16px;align-items:center;background:var(--pc);border:2px solid var(--ln);border-radius:20px;padding:12px 16px;text-decoration:none;color:var(--ink);transition:box-shadow .15s}
.rcard:hover{box-shadow:0 0 0 3px rgba(39,196,255,.6)}
.rcard img,.rcard .ph{width:96px;height:80px;border-radius:14px;object-fit:cover;flex:none;background:#dce9ff;display:grid;place-items:center;color:#0b45e8}
.rt{flex:1;min-width:0}.rt h3{font-size:1.15rem}.rt p{color:var(--mu);font-size:.9rem;margin-top:3px}.rt em{font-style:normal;color:var(--blue);font-weight:600}
.view{background:var(--blue);color:#fff;border-radius:30px;padding:8px 16px;font-weight:600;font-size:.85rem;white-space:nowrap}
.empty{max-width:640px;padding:26px;border:2px dashed var(--ln);border-radius:20px;color:var(--mu);line-height:1.6;background:var(--pc)}
#results{padding:6px 0 30px}#results h2{margin-bottom:14px}
#detail{max-width:900px}#detail h1{font-size:2rem;margin:14px 0 4px}#detail h2{font-size:1.2rem;margin:28px 0 10px}
#detail .lv{color:var(--mu)}#detail ul,#detail ol{padding-left:22px;line-height:1.7;max-width:70ch}
.back,.copy,.cta{display:inline-block;background:var(--blue);color:#fff;border-radius:30px;padding:8px 18px;font-weight:600;text-decoration:none;font-size:.95rem}
.parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.parts span{background:var(--pc);border:1.5px solid var(--ln);border-radius:30px;padding:4px 12px;font-size:.85rem}
.diag{background:var(--pc);border:1.5px solid var(--ln);border-radius:20px;padding:10px;overflow-x:auto}.diag svg{width:100%;min-width:520px;height:auto}
.bx{fill:none;stroke:var(--ln);stroke-width:2}.pin{fill:#1257ff}.pt{font:600 12px system-ui,sans-serif;fill:var(--ink)}.pin+.pt{fill:#fff}.tt{font:700 14px system-ui,sans-serif;fill:var(--ink)}
.codebox{position:relative}.codebox .copy{position:absolute;right:10px;top:10px;padding:6px 14px;font-size:.85rem}
pre{background:#0b1738;color:#d8e6ff;border-radius:16px;padding:18px;overflow-x:auto;font:.9rem/1.55 ui-monospace,Menlo,Consolas,monospace}
.modal{position:fixed;inset:0;background:rgba(5,15,50,.6);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{position:relative;background:var(--bg);border:2px solid var(--cyan);border-radius:26px;padding:22px;max-width:460px;width:100%;box-shadow:0 0 40px rgba(39,196,255,.5);text-align:center}
.mbox img{width:100%;border-radius:16px;margin-bottom:12px}.mbox p{margin:8px 0;color:var(--mu)}.mbox a{color:var(--blue);font-weight:600}
.x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--pc);border:1.5px solid var(--ln);font-size:1.4rem;line-height:1}
.mbox .cta{margin-top:10px}
@media(max-width:700px){.tag{display:none}.view{display:none}.rcard img,.rcard .ph{width:72px;height:64px}}

@media(max-width:700px){
  .wrap{padding:0 12px 36px}.top{gap:10px;padding:12px 0}.logo{font-size:1.7rem}.search{order:3;flex:1 1 100%;max-width:none;margin:0;min-width:0}.avatar{width:40px;height:40px}
  .hi{min-width:0}.himg{overflow:hidden}.rows{padding-left:0}.row{margin:0 0 10px}.rcard{gap:10px;padding:10px;border-radius:16px}.rcard img,.rcard .ph{width:62px;height:58px}.rt h3{font-size:1rem;line-height:1.25}.rt p{font-size:.82rem;line-height:1.35}.view{display:inline-block;font-size:.72rem;padding:6px 9px}
  #detail h1{font-size:1.55rem}#detail h2{margin-top:22px}.diag{padding:6px}.diag svg{min-width:480px}.parts span{font-size:.78rem}.back,.copy,.cta{font-size:.88rem}
}
@media(max-width:420px){.rcard img,.rcard .ph{width:52px;height:52px}.view{display:none}.rt h3{font-size:.94rem}.rt p{font-size:.78rem}.tag{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ft{margin-top:30px;padding-top:16px;border-top:1px solid var(--ln);color:var(--mu);display:flex;gap:20px;flex-wrap:wrap;font-weight:600}.ft a{color:var(--blue);text-decoration:none}

s:["Push the LED into the breadboard. The longer leg is positive (+).","Connect one end of the 220 Ω resistor to the LED’s long leg.","Run a jumper from the other end of the resistor to pin D13.","Run a jumper from the LED’s short leg to GND.","Plug the Arduino into your computer with the USB cable.","Open the Arduino IDE, paste the code, then choose Tools → Board → Arduino Uno and the right port.","Click Upload. The LED blinks once per second."],
c:["const int LED = 13;","","void setup() {","  pinMode(LED, OUTPUT);","}","","void loop() {","  digitalWrite(LED, HIGH);","  delay(1000);","  digitalWrite(LED, LOW);","  delay(1000);","}"]},
us:{t:"Ultrasonic Sensor",lv:"Beginner · about 20 minutes",
parts:["Arduino Uno + USB cable","HC-SR04 ultrasonic sensor","4 jumper wires"],
w:[["5V","HC-SR04 VCC"],["GND","HC-SR04 GND"],["D9","HC-SR04 Trig"],["D10","HC-SR04 Echo"]],
s:["Place the sensor so its two round “eyes” face forward.","Connect VCC to 5V and GND to GND.","Connect Trig to D9 and Echo to D10.","Plug in the Arduino, paste the code and click Upload.","Open Tools → Serial Monitor and set it to 9600 baud.","Move your hand in front of the sensor. The distance in cm appears and changes."],
c:["const int TRIG = 9;","const int ECHO = 10;","","void setup() {","  Serial.begin(9600);","  pinMode(TRIG, OUTPUT);","  pinMode(ECHO, INPUT);","}","","void loop() {","  digitalWrite(TRIG, LOW);","  delayMicroseconds(2);","  digitalWrite(TRIG, HIGH);","  delayMicroseconds(10);","  digitalWrite(TRIG, LOW);","","  long duration = pulseIn(ECHO, HIGH);","  float cm = duration * 0.0343 / 2;","","  Serial.print(\"Distance: \");","  Serial.print(cm);","  Serial.println(\" cm\");","  delay(300);","}"]},
dht:{t:"Temperature Monitor",lv:"Beginner · about 25 minutes",
parts:["Arduino Uno + USB cable","DHT11 sensor module (3 pins)","3 jumper wires","Arduino library: DHT sensor library by Adafruit"],
w:[["5V","DHT11 VCC (+)"],["GND","DHT11 GND (−)"],["D2","DHT11 DATA (S)"]],
s:["In the Arduino IDE open Sketch → Include Library → Manage Libraries.","Search for “DHT sensor library” by Adafruit and click Install. Accept Adafruit Unified Sensor if it asks.","Connect the module: VCC to 5V, GND to GND, DATA to D2.","Paste the code and click Upload.","Open the Serial Monitor at 9600 baud.","Every 2 seconds you see the temperature in °C and the humidity in %. Warm the sensor with your fingers to watch it rise."],
c:["#include <DHT.h>","","#define DHTPIN 2","#define DHTTYPE DHT11","DHT dht(DHTPIN, DHTTYPE);","","void setup() {","  Serial.begin(9600);","  dht.begin();","}","","void loop() {","  delay(2000);","  float t = dht.readTemperature();","  float h = dht.readHumidity();","  if (isnan(t) || isnan(h)) {","    Serial.println(\"Sensor read failed\");","    return;","  }","  Serial.print(\"Temperature: \");","  Serial.print(t);","  Serial.print(\" C  Humidity: \");","  Serial.print(h);","  Serial.println(\" %\");","}"]},
fl:{t:"Flame Sensor",lv:"Beginner · about 20 minutes",
parts:["Arduino Uno + USB cable","Flame sensor module","Active buzzer","5 jumper wires","A candle or lighter for testing (adult supervision, keep away from anything flammable)"],
w:[["5V","Flame sensor VCC"],["GND","Flame sensor GND"],["D2","Flame sensor DO"],["D8","Buzzer + (long leg)"],["GND","Buzzer − (short leg)"]],
s:["Connect the sensor: VCC to 5V, GND to GND, DO to D2.","Connect the buzzer: long leg to D8, short leg to GND.","Paste the code and click Upload.","Open the Serial Monitor at 9600 baud.","Hold a small flame about 20 cm from the sensor. The buzzer sounds and “Flame detected!” appears.","If it never triggers, turn the small screw on the module until its signal LED reacts. If it works the opposite way, change LOW to HIGH in the code."],
c:["const int FLAME = 2;","const int BUZZER = 8;","","void setup() {","  pinMode(FLAME, INPUT);","  pinMode(BUZZER, OUTPUT);","  Serial.begin(9600);","}","","void loop() {","  if (digitalRead(FLAME) == LOW) {   // most modules read LOW when fire is seen","    digitalWrite(BUZZER, HIGH);","    Serial.println(\"Flame detected!\");","  } else {","    digitalWrite(BUZZER, LOW);","  }","  delay(100);","}"]},
car:{t:"Obstacle Avoider",lv:"Intermediate · about 60 minutes",
parts:["Arduino Uno","2WD car chassis with 2 DC motors","L298N motor driver","HC-SR04 ultrasonic sensor","Battery pack, 6–9 V","Jumper wires"],
w:[["5V","HC-SR04 VCC"],["GND","HC-SR04 GND + L298N GND"],["D9","HC-SR04 Trig"],["D10","HC-SR04 Echo"],["D4","L298N IN1"],["D5","L298N IN2"],["D6","L298N IN3"],["D7","L298N IN4"]],
s:["Build the chassis and mount the two motors and wheels.","Connect the left motor to L298N OUT1/OUT2 and the right motor to OUT3/OUT4.","Connect the battery + to the L298N 12V terminal and battery − to its GND. Leave the ENA and ENB jumpers on for full speed.","Join the L298N GND to an Arduino GND so they share a common ground.","Wire IN1–IN4 to D4–D7 and the sensor as shown in the diagram. Mount the sensor on the front.","Upload the code with the car lifted off the table.","Put the car on the floor. It drives forward, then stops, reverses and turns when something is closer than 20 cm.","If a wheel spins the wrong way, swap that motor’s two wires."],
c:["const int TRIG = 9, ECHO = 10;","const int IN1 = 4, IN2 = 5, IN3 = 6, IN4 = 7;","","void setup() {","  pinMode(TRIG, OUTPUT);","  pinMode(ECHO, INPUT);","  for (int p = 4; p <= 7; p++) pinMode(p, OUTPUT);","}","","long distanceCm() {","  digitalWrite(TRIG, LOW);","  delayMicroseconds(2);","  digitalWrite(TRIG, HIGH);","  delayMicroseconds(10);","  digitalWrite(TRIG, LOW);","  return pulseIn(ECHO, HIGH, 30000) * 0.0343 / 2;","}","","void drive(int a, int b, int c, int d) {","  digitalWrite(IN1, a);","  digitalWrite(IN2, b);","  digitalWrite(IN3, c);","  digitalWrite(IN4, d);","}","","void loop() {","  long cm = distanceCm();","  if (cm > 0 && cm < 20) {","    drive(LOW, LOW, LOW, LOW);     // stop","    delay(200);","    drive(LOW, HIGH, LOW, HIGH);   // reverse","    delay(400);","    drive(HIGH, LOW, LOW, HIGH);   // turn","    delay(400);","  } else {","    drive(HIGH, LOW, HIGH, LOW);   // forward","  }","}"]},
mot:{t:"Motor Control",lv:"Beginner · about 30 minutes",
parts:["Arduino Uno + USB cable","L298N motor driver","1 small DC motor","Battery pack, 6–9 V","Jumper wires"],
w:[["D9 (PWM)","L298N ENA (remove its jumper)"],["D8","L298N IN1"],["D7","L298N IN2"],["GND","L298N GND + battery −"]],
s:["Connect the motor’s two wires to L298N OUT1 and OUT2.","Connect the battery + to the L298N 12V terminal and battery − to the L298N GND.","Remove the jumper on the ENA pins, then wire ENA to D9, IN1 to D8 and IN2 to D7.","Run a jumper from the L298N GND to an Arduino GND.","Paste the code and click Upload.","The motor speeds up, stops, then spins the other way. Swap the motor wires if you want the directions reversed."],
c:["const int ENA = 9, IN1 = 8, IN2 = 7;","","void setup() {","  pinMode(ENA, OUTPUT);","  pinMode(IN1, OUTPUT);","  pinMode(IN2, OUTPUT);","}","","void loop() {","  digitalWrite(IN1, HIGH);   // spin one way","  digitalWrite(IN2, LOW);","  for (int s = 0; s <= 255; s += 5) {","    analogWrite(ENA, s);","    delay(40);","  }","  delay(1000);","  analogWrite(ENA, 0);       // stop","  delay(500);","  digitalWrite(IN1, LOW);    // spin the other way","  digitalWrite(IN2, HIGH);","  analogWrite(ENA, 180);","  delay(2000);","  analogWrite(ENA, 0);","  delay(1000);","}"]}
};

P.btn={t:"Push Button LED",lv:"Beginner · about 15 minutes",parts:["Arduino Uno + USB cable","Push button","1 LED","220 Ω resistor","Breadboard + jumper wires"],
w:[["D2","Push button, one leg"],["GND","Push button, opposite-corner leg"],["D8","220 Ω resistor → LED long leg (+)"],["GND","LED short leg (−)"]],
s:["Push the button into the breadboard so it straddles the centre gap.","Connect one button leg to D2 and the leg on the opposite corner to GND.","Put the LED in the breadboard. Connect its long leg through the 220 Ω resistor to D8 and its short leg to GND.","Paste the code and click Upload.","Press and hold the button: the LED lights. Let go and it turns off.","INPUT_PULLUP keeps the pin HIGH until the button pulls it LOW, so you need no extra resistor."],
c:["const int BUTTON = 2;","const int LED = 8;","","void setup() {","  pinMode(BUTTON, INPUT_PULLUP);","  pinMode(LED, OUTPUT);","}","","void loop() {","  if (digitalRead(BUTTON) == LOW) {   // pressed","    digitalWrite(LED, HIGH);","  } else {","    digitalWrite(LED, LOW);","  }","}"]};
P.traf={t:"Traffic Light",lv:"Beginner · about 20 minutes",parts:["Arduino Uno + USB cable","Red, yellow and green LEDs","3 resistors, 220 Ω","Breadboard + jumper wires"],
w:[["D10","220 Ω resistor → red LED long leg (+)"],["D9","220 Ω resistor → yellow LED long leg (+)"],["D8","220 Ω resistor → green LED long leg (+)"],["GND","All three LED short legs (−)"]],
s:["Place the red, yellow and green LEDs in a row on the breadboard.","Connect each long leg through its own 220 Ω resistor: red to D10, yellow to D9, green to D8.","Join the three short legs to the breadboard GND rail, then connect that rail to an Arduino GND pin.","Paste the code and click Upload.","The lights cycle: green for 5 seconds, yellow for 2, red for 5.","Change the numbers inside delay() to change the timing."],
c:["const int RED = 10, YELLOW = 9, GREEN = 8;","","void setup() {","  pinMode(RED, OUTPUT);","  pinMode(YELLOW, OUTPUT);","  pinMode(GREEN, OUTPUT);","}","","void loop() {","  digitalWrite(GREEN, HIGH);","  delay(5000);","  digitalWrite(GREEN, LOW);","  digitalWrite(YELLOW, HIGH);","  delay(2000);","  digitalWrite(YELLOW, LOW);","  digitalWrite(RED, HIGH);","  delay(5000);","  digitalWrite(RED, LOW);","}"]};
P.ldr={t:"Automatic Night Lamp",lv:"Beginner · about 25 minutes",parts:["Arduino Uno + USB cable","LDR (light sensor)","10 kΩ resistor","1 LED","220 Ω resistor","Breadboard + jumper wires"],
w:[["5V","LDR, first leg"],["A0","LDR second leg + 10 kΩ resistor (junction)"],["GND","10 kΩ resistor, other end"],["D9","220 Ω resistor → LED long leg (+)"],["GND","LED short leg (−)"]],
s:["Put the LDR and the 10 kΩ resistor in series: one LDR leg to 5V, the other LDR leg and one resistor leg in the same breadboard column.","Connect the other end of the resistor to GND.","Run a jumper from the shared column to A0.","Connect the LED: long leg through the 220 Ω resistor to D9, short leg to GND.","Paste the code, click Upload and open the Serial Monitor at 9600 baud.","Cover the LDR with your hand. The reading drops and the LED turns on. Change 400 in the code to match the light in your room."],
c:["const int LDR = A0;","const int LED = 9;","","void setup() {","  pinMode(LED, OUTPUT);","  Serial.begin(9600);","}","","void loop() {","  int light = analogRead(LDR);   // 0 = dark, 1023 = bright","  Serial.println(light);","  if (light < 400) {             // dark, so turn the lamp on","    digitalWrite(LED, HIGH);","  } else {","    digitalWrite(LED, LOW);","  }","  delay(200);","}"]};
P.servo={t:"Servo Sweep",lv:"Beginner · about 15 minutes",parts:["Arduino Uno + USB cable","SG90 micro servo","3 jumper wires"],
w:[["D9","Servo signal (orange or yellow wire)"],["5V","Servo power (red wire)"],["GND","Servo ground (brown or black wire)"]],
s:["Plug the three servo wires into the Arduino as shown in the diagram.","Paste the code. The Servo library is already part of the Arduino IDE.","Click Upload. The arm sweeps from 0° to 180° and back.","For a bigger servo, power it from a separate 5–6 V supply and join its ground to the Arduino GND, because the 5V pin cannot supply enough current."],
c:["#include <Servo.h>","","Servo myServo;","","void setup() {","  myServo.attach(9);","}","","void loop() {","  for (int angle = 0; angle <= 180; angle += 2) {","    myServo.write(angle);","    delay(15);","  }","  for (int angle = 180; angle >= 0; angle -= 2) {","    myServo.write(angle);","    delay(15);","  }","}"]};

P.rfid={"t": "RFID Door Lock", "lv": "Advanced · about 60 minutes", "parts": ["Arduino Uno + USB cable", "RC522 RFID reader + card", "SG90 servo", "Active buzzer", "Jumper wires", "Arduino library: MFRC522"], "w": [["D10", "RC522 SDA"], ["D13", "RC522 SCK"], ["D11", "RC522 MOSI"], ["D12", "RC522 MISO"], ["D9", "RC522 RST"], ["3.3V", "RC522 3.3V (not 5V!)"], ["GND", "RC522 GND + servo GND + buzzer −"], ["D6", "Servo signal"], ["D7", "Buzzer +"]], "s": ["Wire the RC522 exactly as in the diagram. It must use 3.3V, because 5V can damage it.", "Connect the servo signal to D6 and the buzzer + to D7. Servo red wire goes to 5V.", "Install the library: Sketch → Include Library → Manage Libraries → search “MFRC522” → Install.", "Upload the code and open the Serial Monitor at 9600 baud.", "Touch your card to the reader. Its UID prints, for example DE AD BE EF.", "Copy your UID into okUID in the code and upload again.", "Touch the card: the servo turns to 90° for 3 seconds. A wrong card makes the buzzer beep."], "c": ["#include <SPI.h>", "#include <MFRC522.h>", "#include <Servo.h>", "", "MFRC522 rfid(10, 9);   // SDA, RST", "Servo lock;", "byte okUID[4] = {0xDE, 0xAD, 0xBE, 0xEF};  // put your card UID here", "", "void setup() {", "  Serial.begin(9600);", "  SPI.begin();", "  rfid.PCD_Init();", "  lock.attach(6);", "  lock.write(0);", "}", "", "void loop() {", "  if (!rfid.PICC_IsNewCardPresent() || !rfid.PICC_ReadCardSerial()) return;", "  bool ok = true;", "  Serial.print(\"UID:\");", "  for (byte i = 0; i < 4; i++) {", "    Serial.print(rfid.uid.uidByte[i], HEX);", "    Serial.print(\" \");", "    if (rfid.uid.uidByte[i] != okUID[i]) ok = false;", "  }", "  Serial.println();", "  if (ok) {", "    lock.write(90);", "    delay(3000);", "    lock.write(0);", "  } else {", "    tone(7, 1000, 500);", "  }", "  rfid.PICC_HaltA();", "}"]};
P.btcar={"t": "Bluetooth Car", "lv": "Advanced · about 75 minutes", "parts": ["Arduino Uno", "2WD car chassis with 2 DC motors", "L298N motor driver", "HC-05 Bluetooth module", "Battery pack, 6–9 V", "1 kΩ + 2 kΩ resistors (voltage divider)", "Phone app: Serial Bluetooth Terminal"], "w": [["D2", "HC-05 TX"], ["D3", "HC-05 RX (through 1 kΩ + 2 kΩ divider)"], ["5V", "HC-05 VCC"], ["GND", "HC-05 GND + L298N GND"], ["D4", "L298N IN1"], ["D5", "L298N IN2"], ["D6", "L298N IN3"], ["D7", "L298N IN4"]], "s": ["Build the chassis. Connect the left motor to L298N OUT1/OUT2 and the right motor to OUT3/OUT4.", "Connect battery + to the L298N 12V terminal and battery − to GND. Join L298N GND to Arduino GND.", "Wire IN1–IN4 to D4–D7.", "Wire the HC-05: TX to D2, VCC to 5V, GND to GND. For RX, make a divider (D3 → 1 kΩ → RX, with 2 kΩ from RX to GND) to drop 5V to 3.3V.", "Upload the code. Unplug D2 while uploading if it fails.", "Pair your phone with HC-05 (password 1234 or 0000) and open the terminal app.", "Send F, B, L, R to drive and S to stop. If a wheel is reversed, swap that motor’s wires."], "c": ["#include <SoftwareSerial.h>", "", "SoftwareSerial bt(2, 3);   // RX, TX", "const int IN1 = 4, IN2 = 5, IN3 = 6, IN4 = 7;", "", "void drive(int a, int b, int c, int d) {", "  digitalWrite(IN1, a);", "  digitalWrite(IN2, b);", "  digitalWrite(IN3, c);", "  digitalWrite(IN4, d);", "}", "", "void setup() {", "  bt.begin(9600);", "  for (int p = 4; p <= 7; p++) pinMode(p, OUTPUT);", "}", "", "void loop() {", "  if (!bt.available()) return;", "  char c = bt.read();", "  if (c == 'F') drive(HIGH, LOW, HIGH, LOW);", "  else if (c == 'B') drive(LOW, HIGH, LOW, HIGH);", "  else if (c == 'L') drive(LOW, HIGH, HIGH, LOW);", "  else if (c == 'R') drive(HIGH, LOW, LOW, HIGH);", "  else drive(LOW, LOW, LOW, LOW);", "}"]};
P.wled={"t": "WiFi LED Control", "b": "NodeMCU ESP8266", "lv": "IoT · about 30 minutes", "parts": ["NodeMCU ESP8266 + micro-USB cable", "1 LED", "220 Ω resistor", "Breadboard + jumper wires", "WiFi network and password"], "w": [["D1", "220 Ω resistor → LED long leg (+)"], ["GND", "LED short leg (−)"]], "s": ["Install the board: File → Preferences → add the ESP8266 boards URL, then Tools → Board → Boards Manager → install “esp8266”.", "Connect D1 through the 220 Ω resistor to the LED long leg. Connect the short leg to GND.", "In the code, type your WiFi name and password.", "Choose Tools → Board → NodeMCU 1.0 and the right port, then Upload.", "Open the Serial Monitor at 115200 baud. After a few seconds it prints an IP address.", "Type that IP in your phone browser (same WiFi). Tap ON or OFF to control the LED."], "c": ["#include <ESP8266WiFi.h>", "", "const char* ssid = \"YOUR_WIFI\";", "const char* pass = \"YOUR_PASSWORD\";", "const int LED = 5;   // D1", "WiFiServer server(80);", "", "void setup() {", "  Serial.begin(115200);", "  pinMode(LED, OUTPUT);", "  WiFi.begin(ssid, pass);", "  while (WiFi.status() != WL_CONNECTED) {", "    delay(500);", "    Serial.print(\".\");", "  }", "  Serial.println(WiFi.localIP());", "  server.begin();", "}", "", "void loop() {", "  WiFiClient client = server.available();", "  if (!client) return;", "  String req = client.readStringUntil('\\r');", "  client.flush();", "  if (req.indexOf(\"/on\") > 0) digitalWrite(LED, HIGH);", "  if (req.indexOf(\"/off\") > 0) digitalWrite(LED, LOW);", "  client.print(\"HTTP/1.1 200 OK\\r\\nContent-Type: text/html\\r\\n\\r\\n\");", "  client.print(\"<h1>LED Control</h1><a href='/on'>ON</a> | <a href='/off'>OFF</a>\");", "}"]};
P.wx={"t": "WiFi Weather Station", "b": "NodeMCU ESP8266", "lv": "IoT · about 45 minutes", "parts": ["NodeMCU ESP8266 + micro-USB cable", "DHT11 sensor module (3 pins)", "3 jumper wires", "Arduino library: DHT sensor library by Adafruit"], "w": [["3V3", "DHT11 VCC (+)"], ["GND", "DHT11 GND (−)"], ["D4", "DHT11 DATA (S)"]], "s": ["Install the ESP8266 board package and the DHT sensor library (Sketch → Include Library → Manage Libraries).", "Connect the DHT11: VCC to 3V3, GND to GND, DATA to D4.", "Type your WiFi name and password in the code.", "Select NodeMCU 1.0 and Upload.", "Open the Serial Monitor at 115200 baud and note the IP address.", "Open that IP in a browser on the same WiFi. The page shows the temperature and humidity. Refresh to update."], "c": ["#include <ESP8266WiFi.h>", "#include <DHT.h>", "", "const char* ssid = \"YOUR_WIFI\";", "const char* pass = \"YOUR_PASSWORD\";", "DHT dht(2, DHT11);   // D4 = GPIO2", "WiFiServer server(80);", "", "void setup() {", "  Serial.begin(115200);", "  dht.begin();", "  WiFi.begin(ssid, pass);", "  while (WiFi.status() != WL_CONNECTED) {", "    delay(500);", "  }", "  Serial.println(WiFi.localIP());", "  server.begin();", "}", "", "void loop() {", "  WiFiClient client = server.available();", "  if (!client) return;", "  client.readStringUntil('\\r');", "  client.flush();", "  float t = dht.readTemperature();", "  float h = dht.readHumidity();", "  client.print(\"HTTP/1.1 200 OK\\r\\nContent-Type: text/html\\r\\n\\r\\n\");", "  client.print(\"<h1>Weather Station</h1><p>Temperature: \" + String(t) + \" C</p>\");", "  client.print(\"<p>Humidity: \" + String(h) + \" %</p>\");", "}"]};
P.pid={"t": "PID Line Follower", "lv": "Very advanced · about 2 hours", "parts": ["Arduino Uno", "2WD chassis with 2 DC motors", "L298N motor driver", "3 IR line sensors", "Battery pack, 7–9 V", "Black tape on a white floor"], "w": [["D8", "Left IR sensor OUT"], ["D9", "Centre IR sensor OUT"], ["D10", "Right IR sensor OUT"], ["D5 (PWM)", "L298N ENA"], ["D6 (PWM)", "L298N ENB"], ["D4", "L298N IN1"], ["D7", "L298N IN2"], ["D12", "L298N IN3"], ["D13", "L298N IN4"], ["GND", "All GND joined (sensors, L298N, battery −)"]], "s": ["Mount the three IR sensors at the front, facing the floor, about 1 cm apart, with the centre one over the line.", "Connect the motors to L298N OUT1–OUT4 and remove the ENA and ENB jumpers. Wire the pins as in the diagram.", "Power the sensors from 5V and join every GND together.", "Upload the code and test with the wheels off the floor. Check that both wheels drive forward.", "Put the robot on a black line. Most modules read HIGH on black. If yours read the opposite, change HIGH to LOW in readSensors.", "Tune it: raise Kp if it reacts too slowly, raise Kd if it wobbles, and lower base if it leaves the line on curves."], "c": ["const int SL = 8, SC = 9, SR = 10;", "const int ENA = 5, ENB = 6, IN1 = 4, IN2 = 7, IN3 = 12, IN4 = 13;", "float Kp = 25, Kd = 15;", "int base = 150;", "float lastErr = 0;", "", "void setup() {", "  int pins[] = {ENA, ENB, IN1, IN2, IN3, IN4};", "  for (int i = 0; i < 6; i++) pinMode(pins[i], OUTPUT);", "  pinMode(SL, INPUT); pinMode(SC, INPUT); pinMode(SR, INPUT);", "  digitalWrite(IN1, HIGH); digitalWrite(IN2, LOW);", "  digitalWrite(IN3, HIGH); digitalWrite(IN4, LOW);", "}", "", "float readSensors() {", "  bool l = digitalRead(SL) == HIGH;", "  bool c = digitalRead(SC) == HIGH;", "  bool r = digitalRead(SR) == HIGH;", "  if (l && !r) return -1;", "  if (r && !l) return 1;", "  if (c) return 0;", "  return lastErr;   // line lost: keep last direction", "}", "", "void loop() {", "  float err = readSensors();", "  float corr = Kp * err + Kd * (err - lastErr);", "  lastErr = err;", "  analogWrite(ENA, constrain(base + corr, 0, 255));", "  analogWrite(ENB, constrain(base - corr, 0, 255));", "}"]};
P.radar={"t": "Servo Radar Scanner", "lv": "Very advanced · about 90 minutes", "parts": ["Arduino Uno + USB cable", "HC-SR04 ultrasonic sensor", "SG90 servo", "Active buzzer", "Jumper wires", "Something to fix the sensor on the servo arm"], "w": [["D9", "Servo signal"], ["5V", "Servo VCC + HC-SR04 VCC"], ["GND", "Servo GND + HC-SR04 GND + buzzer −"], ["D6", "HC-SR04 Trig"], ["D7", "HC-SR04 Echo"], ["D8", "Buzzer +"]], "s": ["Fix the HC-SR04 on the servo arm so it turns with the servo.", "Wire the servo to D9, the sensor to D6 and D7, and the buzzer to D8.", "Paste the code and click Upload.", "Open the Serial Monitor at 9600 baud. The servo sweeps from 15° to 165° and prints the angle and distance, like 90,42.", "Put objects in front of it. When something is closer than 20 cm the buzzer sounds.", "Challenge: open Tools → Serial Plotter to see the distance graph as the radar sweeps."], "c": ["#include <Servo.h>", "", "const int TRIG = 6, ECHO = 7, BUZ = 8;", "Servo radar;", "", "long distanceCm() {", "  digitalWrite(TRIG, LOW);", "  delayMicroseconds(2);", "  digitalWrite(TRIG, HIGH);", "  delayMicroseconds(10);", "  digitalWrite(TRIG, LOW);", "  return pulseIn(ECHO, HIGH, 30000) * 0.0343 / 2;", "}", "", "void scan(int a) {", "  radar.write(a);", "  delay(30);", "  long cm = distanceCm();", "  Serial.print(a);", "  Serial.print(\",\");", "  Serial.println(cm);", "  digitalWrite(BUZ, (cm > 0 && cm < 20) ? HIGH : LOW);", "}", "", "void setup() {", "  Serial.begin(9600);", "  pinMode(TRIG, OUTPUT);", "  pinMode(ECHO, INPUT);", "  pinMode(BUZ, OUTPUT);", "  radar.attach(9);", "}", "", "void loop() {", "  for (int a = 15; a <= 165; a += 3) scan(a);", "  for (int a = 165; a >= 15; a -= 3) scan(a);", "}"]};

function diagram(p){
  var n=p.w.length,h=70+n*46,cols=["#e5232d","#1257ff","#12a150","#f59e0b","#8b5cf6","#0891b2","#db2777","#65a30d"];

   +'<rect x="8" y="8" width="150" height="'+(h-16)+'" rx="12" class="bx"/><text x="83" y="34" text-anchor="middle" class="tt">'+(p.b||"Arduino Uno")+'</text>'
   +'<rect x="270" y="8" width="362" height="'+(h-16)+'" rx="12" class="bx"/><text x="451" y="34" text-anchor="middle" class="tt">Part connection</text>';
  p.w.forEach(function(w,i){
    var y=66+i*46,c=cols[i%8];
    s+='<rect x="24" y="'+(y-14)+'" width="118" height="28" rx="14" class="pin"/><text x="83" y="'+(y+4)+'" text-anchor="middle" class="pt">'+w[0]+'</text>'
     +'<line x1="142" y1="'+y+'" x2="282" y2="'+y+'" stroke="'+c+'" stroke-width="3.5" stroke-linecap="round"/>'
     +'<circle cx="142" cy="'+y+'" r="4" fill="'+c+'"/><circle cx="282" cy="'+y+'" r="4" fill="'+c+'"/>'
     +'<text x="294" y="'+(y+4)+'" class="pt">'+w[1]+'</text>';
  });
  return s+'</svg>';
}
